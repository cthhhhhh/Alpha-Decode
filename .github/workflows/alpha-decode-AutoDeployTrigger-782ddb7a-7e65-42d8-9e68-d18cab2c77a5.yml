name: Trigger auto deployment for alpha-decode

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/alpha-decode-AutoDeployTrigger-782ddb7a-7e65-42d8-9e68-d18cab2c77a5.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ALPHADECODE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ALPHADECODE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ALPHADECODE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: dockerfile
          _targetLabelKey_: _targetLabel_
          registryUrl: cs203reg-cahscsdhf7f5hray.azurecr.io
          registryUsername: ${{ secrets.ALPHADECODE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.ALPHADECODE_REGISTRY_PASSWORD }}
          containerAppName: alpha-decode
          resourceGroup: CS203T1
          imageToDeploy: cs203reg-cahscsdhf7f5hray.azurecr.io/alpha-decode:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


