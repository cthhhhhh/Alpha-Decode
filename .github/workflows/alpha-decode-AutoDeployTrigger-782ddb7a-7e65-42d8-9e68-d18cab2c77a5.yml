name: Trigger auto deployment for alpha-decode

# When this action will be executed
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Run Tests and Generate Coverage

        run: mvn clean test -Dskip.frontend=true

      - name: Upload Jacoco Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ALPHADECODE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ALPHADECODE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ALPHADECODE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: dockerfile
          registryUrl: cs203reg-cahscsdhf7f5hray.azurecr.io
          registryUsername: ${{ secrets.ALPHADECODE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.ALPHADECODE_REGISTRY_PASSWORD }}
          containerAppName: alpha-decode
          resourceGroup: CS203T1
          imageToBuild: cs203reg-cahscsdhf7f5hray.azurecr.io/alpha-decode:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


