# Use H2 in-memory database for tests — no PostgreSQL or .env needed
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Stub out JWT values so JwtUtil can boot
jwt.secret=test-secret-key-must-be-at-least-32-chars-long!!
jwt.expiration-ms=86400000

# Disable leaderboard and other non-test concerns
leaderboard.default-limit=10

spring.jackson.mapper.accept-case-insensitive-enums=true
spring.jackson.serialization.write-enums-using-to-string=true
spring.jackson.serialization.write-dates-as-timestamps=false
